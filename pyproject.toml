[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imap-mcp"
dynamic = ["version"]
description = "Serveur MCP pour une boîte mail via IMAP/SMTP : lecture, recherche, brouillons, envoi."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PacomeKFP" }]
keywords = ["mcp", "imap", "smtp", "email", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.2,<3",
    "keyring",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "tomli>=2.0",
]

[project.scripts]
imap-mcp = "imap_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/PacomeKFP/imap-mcp"
Repository = "https://github.com/PacomeKFP/imap-mcp"
Issues = "https://github.com/PacomeKFP/imap-mcp/issues"

[tool.hatch.version]
path = "src/imap_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/imap_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "B", "UP", "SIM", "RUF", "I", "S", "ASYNC",
    "BLE", "DTZ", "PTH", "C4", "PERF",
]
# Line length is enforced by `ruff format`, which is not blocking yet.
ignore = ["E501"]

# Temporary: findings in files outside the current cleanup scope. Remove each entry once fixed.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/imap_mcp/approval.py" = ["BLE001"]
"src/imap_mcp/journal.py" = ["DTZ005"]
"src/imap_mcp/permissions.py" = ["DTZ005"]
"src/imap_mcp/rights.py" = ["PTH105"]
"src/imap_mcp/rights_cli.py" = ["I001"]
"src/imap_mcp/tools/reading.py" = ["ASYNC240"]
"tests/test_rights.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["imap_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
